<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Smoke</title>
    
<style>*
{
    margin: 0;
    padding: 0;
}

html,
body
{
    overflow: hidden;
}

.webgl
{
    position: fixed;
    top: 0;
    left: 0;
    outline: none;
}
</style><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/":"/vendor/three/","lil-gui":"/vendor/lil-gui.esm.js","gsap":"/vendor/gsap.esm.js","stats.js":"/vendor/stats.esm.js","cannon-es":"/vendor/cannon-es.esm.js"}}</script></head>
<body>
    <canvas class="webgl"></canvas>
    
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'
import GUI from 'lil-gui'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'

const coffeeSmokeVertexShader = "uniform float uTime;\nuniform sampler2D uPerlinTexture;\n\nvarying vec2 vUv;\n\n#include ../includes/rotate2D.glsl\n\nvoid main()\n{\n    vec3 newPosition = position;\n\n    // Twist\n    float twistPerlin = texture(\n        uPerlinTexture,\n        vec2(0.5, uv.y * 0.2 - uTime * 0.005)\n    ).r;\n    float angle = twistPerlin * 10.0;\n    newPosition.xz = rotate2D(newPosition.xz, angle);\n\n    // Wind\n    vec2 windOffset = vec2(\n        texture(uPerlinTexture, vec2(0.25, uTime * 0.01)).r - 0.5,\n        texture(uPerlinTexture, vec2(0.75, uTime * 0.01)).r - 0.5\n    );\n    windOffset *= pow(uv.y, 2.0) * 10.0;\n    newPosition.xz += windOffset;\n\n    // Final position\n    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);\n\n    // Varyings\n    vUv = uv;\n}"
const coffeeSmokeFragmentShader = "uniform float uTime;\nuniform sampler2D uPerlinTexture;\n\nvarying vec2 vUv;\n\nvoid main()\n{\n    // Scale and animate\n    vec2 smokeUv = vUv;\n    smokeUv.x *= 0.5;\n    smokeUv.y *= 0.3;\n    smokeUv.y -= uTime * 0.03;\n\n    // Smoke\n    float smoke = texture(uPerlinTexture, smokeUv).r;\n\n    // Remap\n    smoke = smoothstep(0.4, 1.0, smoke);\n\n    // Edges\n    smoke *= smoothstep(0.0, 0.1, vUv.x);\n    smoke *= smoothstep(1.0, 0.9, vUv.x);\n    smoke *= smoothstep(0.0, 0.1, vUv.y);\n    smoke *= smoothstep(1.0, 0.4, vUv.y);\n\n    // Final color\n    gl_FragColor = vec4(0.6, 0.3, 0.2, smoke);\n    #include <tonemapping_fragment>\n    #include <colorspace_fragment>\n}"

/**
 * Base
 */
// Debug
const gui = new GUI()

// Canvas
const canvas = document.querySelector('canvas.webgl')

// Scene
const scene = new THREE.Scene()

// Loaders
const textureLoader = new THREE.TextureLoader()
const gltfLoader = new GLTFLoader()

/**
 * Sizes
 */
const sizes = {
    width: window.innerWidth,
    height: window.innerHeight
}

window.addEventListener('resize', () =>
{
    // Update sizes
    sizes.width = window.innerWidth
    sizes.height = window.innerHeight

    // Update camera
    camera.aspect = sizes.width / sizes.height
    camera.updateProjectionMatrix()

    // Update renderer
    renderer.setSize(sizes.width, sizes.height)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
})

/**
 * Camera
 */
// Base camera
const camera = new THREE.PerspectiveCamera(25, sizes.width / sizes.height, 0.1, 100)
camera.position.x = 8
camera.position.y = 10
camera.position.z = 12
scene.add(camera)

// Controls
const controls = new OrbitControls(camera, canvas)
controls.target.y = 3
controls.enableDamping = true

/**
 * Renderer
 */
const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
})
renderer.setSize(sizes.width, sizes.height)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))

/**
 * Model
 */
gltfLoader.load(
    './bakedModel.glb',
    (gltf) =>
    {
        gltf.scene.getObjectByName('baked').material.map.anisotropy = 8
        scene.add(gltf.scene)
    }
)

/**
 * Smoke
 */
// Geometry
const smokeGeometry = new THREE.PlaneGeometry(1, 1, 16, 64)
smokeGeometry.translate(0, 0.5, 0)
smokeGeometry.scale(1.5, 6, 1.5)

// Perlin texture
const perlinTexture = textureLoader.load('/assets/32-coffee-smoke-shader-final/perlin.png')
perlinTexture.wrapS = THREE.RepeatWrapping
perlinTexture.wrapT = THREE.RepeatWrapping

// Material
const smokeMaterial = new THREE.ShaderMaterial({
    vertexShader: coffeeSmokeVertexShader,
    fragmentShader: coffeeSmokeFragmentShader,
    uniforms:
    {
        uTime: new THREE.Uniform(0),
        uPerlinTexture: new THREE.Uniform(perlinTexture)
    },
    side: THREE.DoubleSide,
    transparent: true,
    depthWrite: false
    // wireframe: true
})

// Mesh
const smoke = new THREE.Mesh(smokeGeometry, smokeMaterial)
smoke.position.y = 1.83
scene.add(smoke)

/**
 * Animate
 */
const clock = new THREE.Clock()

const tick = () =>
{
    const elapsedTime = clock.getElapsedTime()

    // Update smoke
    smokeMaterial.uniforms.uTime.value = elapsedTime

    // Update controls
    controls.update()

    // Render
    renderer.render(scene, camera)

    // Call tick again on the next frame
    window.requestAnimationFrame(tick)
}

tick()


</script></body>
</html>
