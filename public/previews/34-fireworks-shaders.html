<html lang="en">
<head>

<body>
    <canvas class="webgl"></canvas>
    
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'
import GUI from 'lil-gui'
import gsap from 'gsap'
import { Sky } from 'three/examples/jsm/objects/Sky.js'

const fireworkVertexShader = "uniform float uSize;\nuniform vec2 uResolution;\nuniform float uProgress;\n\nattribute float aSize;\nattribute float aTimeMultiplier;\n\n#include ../includes/remap.glsl\n\nvoid main()\n{\n    float progress = uProgress * aTimeMultiplier;\n    vec3 newPosition = position;\n\n    // Exploding\n    float explodingProgress = remap(progress, 0.0, 0.1, 0.0, 1.0);\n    explodingProgress = clamp(explodingProgress, 0.0, 1.0);\n    explodingProgress = 1.0 - pow(1.0 - explodingProgress, 3.0);\n    newPosition *= explodingProgress;\n\n    // Falling\n    float fallingProgress = remap(progress, 0.1, 1.0, 0.0, 1.0);\n    fallingProgress = clamp(fallingProgress, 0.0, 1.0);\n    fallingProgress = 1.0 - pow(1.0 - fallingProgress, 3.0);\n    newPosition.y -= fallingProgress * 0.2;\n\n    // Scaling\n    float sizeOpeningProgress = remap(progress, 0.0, 0.125, 0.0, 1.0);\n    float sizeClosingProgress = remap(progress, 0.125, 1.0, 1.0, 0.0);\n    float sizeProgress = min(sizeOpeningProgress, sizeClosingProgress);\n    sizeProgress = clamp(sizeProgress, 0.0, 1.0);\n\n    // Twinkling\n    float twinklingProgress = remap(progress, 0.2, 0.8, 0.0, 1.0);\n    twinklingProgress = clamp(twinklingProgress, 0.0, 1.0);\n    float sizeTwinkling = sin(progress * 30.0) * 0.5 + 0.5;\n    sizeTwinkling = 1.0 - sizeTwinkling * twinklingProgress;\n\n    // Final position\n    vec4 modelPosition = modelMatrix * vec4(newPosition, 1.0);\n    vec4 viewPosition = viewMatrix * modelPosition;\n    gl_Position = projectionMatrix * viewPosition;\n    \n    // Final size\n    gl_PointSize = uSize * uResolution.y * aSize * sizeProgress * sizeTwinkling;\n    gl_PointSize *= 1.0 / - viewPosition.z;\n    \n    if(gl_PointSize < 1.0)\n        gl_Position = vec4(9999.9);\n}"
const fireworkFragmentShader = "uniform sampler2D uTexture;\nuniform vec3 uColor;\n\nvoid main()\n{\n    float textureAlpha = texture(uTexture, gl_PointCoord).r;\n\n    // Final color\n    gl_FragColor = vec4(uColor, textureAlpha);\n    #include <tonemapping_fragment>\n    #include <colorspace_fragment>\n}"

/**
 * Base
 */
// Debug
const gui = new GUI({ width: 340 })

// Canvas
const canvas = document.querySelector('canvas.webgl')

// Scene
const scene = new THREE.Scene()

// Loaders
const textureLoader = new THREE.TextureLoader()

/**
 * Sizes
 */
const sizes = {
    width: window.innerWidth,
    height: window.innerHeight,
    pixelRatio: Math.min(window.devicePixelRatio, 2)
}
sizes.resolution = new THREE.Vector2(sizes.width * sizes.pixelRatio, sizes.height * sizes.pixelRatio)

window.addEventListener('resize', () =>
{
    // Update sizes
    sizes.width = window.innerWidth
    sizes.height = window.innerHeight
    sizes.pixelRatio = Math.min(window.devicePixelRatio, 2)
    sizes.resolution.set(sizes.width * sizes.pixelRatio, sizes.height * sizes.pixelRatio)

    // Update camera
    camera.aspect = sizes.width / sizes.height
    camera.updateProjectionMatrix()

    // Update renderer
    renderer.setSize(sizes.width, sizes.height)
    renderer.setPixelRatio(sizes.pixelRatio)
})

/**
 * Camera
 */
// Base camera
const camera = new THREE.PerspectiveCamera(25, sizes.width / sizes.height, 0.1, 100)
camera.position.set(1.5, 0, 6)
scene.add(camera)

// Controls
const controls = new OrbitControls(camera, canvas)
controls.enableDamping = true

/**
 * Renderer
 */
const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
})
renderer.setSize(sizes.width, sizes.height)
renderer.setPixelRatio(sizes.pixelRatio)

/**
 * Fireworks
 */
const textures = [
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/1.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/2.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/3.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/4.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/5.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/6.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/7.png'),
    textureLoader.load('/assets/34-fireworks-shaders-final/particles/8.png'),
]

const createFirework = (count, position, size, texture, radius, color) =>
{
    // Geometry
    const positionsArray = new Float32Array(count * 3)
    const sizesArray = new Float32Array(count)
    const timeMultipliersArray = new Float32Array(count)

    for(let i = 0; i < count; i++)
    {
        const i3 = i * 3

        const spherical = new THREE.Spherical(
            radius * (0.75 + Math.random() * 0.25),
            Math.random() * Math.PI,
            Math.random() * Math.PI * 2
        )
        const position = new THREE.Vector3()
        position.setFromSpherical(spherical)

        positionsArray[i3    ] = position.x
        positionsArray[i3 + 1] = position.y
        positionsArray[i3 + 2] = position.z

        sizesArray[i] = Math.random()

        timeMultipliersArray[i] = 1 + Math.random()
    }

    const geometry = new THREE.BufferGeometry()
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positionsArray, 3))
    geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizesArray, 1))
    geometry.setAttribute('aTimeMultiplier', new THREE.Float32BufferAttribute(timeMultipliersArray, 1))

    // Material
    texture.flipY = false
    const material = new THREE.ShaderMaterial({
        vertexShader: fireworkVertexShader,
        fragmentShader: fireworkFragmentShader,
        uniforms:
        {
            uSize: new THREE.Uniform(size),
            uResolution: new THREE.Uniform(sizes.resolution),
            uTexture: new THREE.Uniform(texture),
            uColor: new THREE.Uniform(color),
            uProgress: new THREE.Uniform(0)
        },
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    })

    // Points
    const firework = new THREE.Points(geometry, material)
    firework.position.copy(position)
    scene.add(firework)

    // Destroy
    const destroy = () =>
    {
        scene.remove(firework)
        geometry.dispose()
        material.dispose()
    }

    // Animate
    gsap.to(
        material.uniforms.uProgress,
        { value: 1, ease: 'linear', duration: 3, onComplete: destroy },
    )
}

const createRandomFirework = () =>
{
    const count = Math.round(400 + Math.random() * 1000)
    const position = new THREE.Vector3(
        (Math.random() - 0.5) * 2,
        Math.random(),
        (Math.random() - 0.5) * 2
    )
    const size = 0.1 + Math.random() * 0.1
    const texture = textures[Math.floor(Math.random() * textures.length)]
    const radius = 0.5 + Math.random()
    const color = new THREE.Color()
    color.setHSL(Math.random(), 1, 0.7)
    createFirework(count, position, size, texture, radius, color)
}

createRandomFirework()

window.addEventListener('click', createRandomFirework)

/**
 * Sky
 */
const sky = new Sky()
sky.scale.setScalar(450000)
scene.add(sky)

const sun = new THREE.Vector3()

const skyParameters = {
    turbidity: 10,
    rayleigh: 3,
    mieCoefficient: 0.005,
    mieDirectionalG: 0.95,
    elevation: -2.2,
    azimuth: 180,
    exposure: renderer.toneMappingExposure
}

const updateSky = () =>
{
    const uniforms = sky.material.uniforms
    uniforms['turbidity'].value = skyParameters.turbidity
    uniforms['rayleigh'].value = skyParameters.rayleigh
    uniforms['mieCoefficient'].value = skyParameters.mieCoefficient
    uniforms['mieDirectionalG'].value = skyParameters.mieDirectionalG

    const phi = THREE.MathUtils.degToRad(90 - skyParameters.elevation)
    const theta = THREE.MathUtils.degToRad(skyParameters.azimuth)

    sun.setFromSphericalCoords(1, phi, theta)

    uniforms['sunPosition'].value.copy(sun)

    renderer.toneMappingExposure = skyParameters.exposure
    renderer.render(scene, camera)
}

gui.add(skyParameters, 'turbidity', 0.0, 20.0, 0.1).onChange(updateSky)
gui.add(skyParameters, 'rayleigh', 0.0, 4, 0.001).onChange(updateSky)
gui.add(skyParameters, 'mieCoefficient', 0.0, 0.1, 0.001).onChange(updateSky)
gui.add(skyParameters, 'mieDirectionalG', 0.0, 1, 0.001).onChange(updateSky)
gui.add(skyParameters, 'elevation', -3, 10, 0.01).onChange(updateSky)
gui.add(skyParameters, 'azimuth', - 180, 180, 0.1).onChange(updateSky)
gui.add(skyParameters, 'exposure', 0, 1, 0.0001).onChange(updateSky)

updateSky()

/**
 * Animate
 */
const tick = () =>
{
    // Update controls
    controls.update()

    // Render
    renderer.render(scene, camera)

    // Call tick again on the next frame
    window.requestAnimationFrame(tick)
}

tick()


</script></body>
</html>
