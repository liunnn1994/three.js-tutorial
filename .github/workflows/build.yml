name: Build and Release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      has_release: ${{ steps.check.outputs.has_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Check if new release was created
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_STARTED="${{ github.event.workflow_run.run_started_at }}"
          LATEST_RELEASE=$(gh release view --repo ${{ github.repository }} --json tagName,createdAt -q '.tagName // empty')
          if [ -z "$LATEST_RELEASE" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          RELEASE_TIME=$(gh release view --repo ${{ github.repository }} --json createdAt -q '.createdAt')
          if [[ "$RELEASE_TIME" > "$RUN_STARTED" ]]; then
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          else
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

  build-desktop:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app'
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --no-bundle'
          - platform: ubuntu-22.04
            args: '--bundles appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Pack macOS app to zip
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          for app in src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app; do
            [ -e "$app" ] || continue
            zip -r -y "${app}.zip" "$app"
          done

      - name: Upload macOS artifacts to release
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: find src-tauri/target -path "*/bundle/macos/*.app.zip" -type f -print0 | xargs -0 gh release upload ${{ needs.check.outputs.tag_name }} --clobber

      - name: Upload Windows artifacts to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: find src-tauri/target/x86_64-pc-windows-msvc/release -maxdepth 1 -type f -name "*.exe" -print0 | xargs -0 gh release upload ${{ needs.check.outputs.tag_name }} --clobber

      - name: Upload Linux artifacts to release
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: find src-tauri/target -path "*/bundle/appimage/*" -type f \( -name "*.AppImage" -o -name "*.appimage" \) -print0 | xargs -0 gh release upload ${{ needs.check.outputs.tag_name }} --clobber

  build-android:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Initialize Android
        run: pnpm tauri android init

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          mobile: 'android'
          args: '--target aarch64-linux-android'

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: find src-tauri/target -path "*/bundle/android*" -type f -name "*.apk" -print0 | xargs -0 -I {} gh release upload ${{ needs.check.outputs.tag_name }} {} --clobber || true
