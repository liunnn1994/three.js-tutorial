name: Build and Release
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.inputs.tag_name || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag to build (e.g. v1.4.0). If empty, use latest release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.check.outputs.has_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Check if new release was created
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REQUESTED_TAG="${{ github.event.inputs.tag_name || '' }}"
            if [[ -n "$REQUESTED_TAG" ]]; then
              if gh release view "$REQUESTED_TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
                echo "has_release=true" >> "$GITHUB_OUTPUT"
                echo "tag_name=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
              else
                echo "has_release=false" >> "$GITHUB_OUTPUT"
                echo "Requested tag '$REQUESTED_TAG' does not exist"
              fi
              exit 0
            fi

            LATEST_RELEASE=$(gh release view --repo ${{ github.repository }} --json tagName -q '.tagName // empty')
            if [[ -z "$LATEST_RELEASE" ]]; then
              echo "has_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_STARTED="${{ github.event.workflow_run.run_started_at }}"
          LATEST_RELEASE=$(gh release view --repo ${{ github.repository }} --json tagName,createdAt -q '.tagName // empty')
          if [ -z "$LATEST_RELEASE" ]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TIME=$(gh release view --repo ${{ github.repository }} --json createdAt -q '.createdAt')
          if [[ "$RELEASE_TIME" > "$RUN_STARTED" ]]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: windows-latest
            target: ""
            args: "--target x86_64-pc-windows-msvc --no-bundle"
          - platform: ubuntu-22.04
            target: ""
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Pack macOS app to zip
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          for app in src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app; do
            [ -e "$app" ] || continue
            zip -r -y "${app}.zip" "$app"
          done

      - name: Upload macOS artifacts to release
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find src-tauri/target -path "*/bundle/macos/*.app.zip" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS artifacts found"
            exit 0
          fi
          gh release upload ${{ needs.check.outputs.tag_name }} "${files[@]}" --clobber

      - name: Upload Windows artifacts to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find src-tauri/target/x86_64-pc-windows-msvc/release -maxdepth 1 -type f -name "*.exe" -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Windows artifacts found"
            exit 0
          fi
          gh release upload ${{ needs.check.outputs.tag_name }} "${files[@]}" --clobber

      - name: Upload Linux artifacts to release
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find src-tauri/target -path "*/bundle/appimage/*" -type f \( -name "*.AppImage" -o -name "*.appimage" \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux artifacts found"
            exit 0
          fi
          gh release upload ${{ needs.check.outputs.tag_name }} "${files[@]}" --clobber

  build-android:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (Ubuntu runner)
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          docker image prune --all --force || true
          df -h

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-targets: false

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset generated Android project
        shell: bash
        run: rm -rf src-tauri/gen/android

      - name: Initialize Android
        run: pnpm tauri android init

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "Missing Android signing secrets. Please set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/android-release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Android APK (arm64)
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail

          (
            while true; do
              echo "[heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') Android build still running"
              df -h / | tail -1
              sleep 30
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

          pnpm run tauri:android:build

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find src-tauri/gen/android/app/build/outputs -type f -name "*.apk" ! -name "*-unsigned.apk" -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No signed Android APK artifacts found"
            exit 1
          fi
          gh release upload ${{ needs.check.outputs.tag_name }} "${files[@]}" --clobber
