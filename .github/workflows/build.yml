name: Build and Release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      has_release: ${{ steps.check.outputs.has_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Check if new release was created
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_TIME="${{ github.event.workflow_run.updated_at }}"
          LATEST_RELEASE=$(gh release view --repo ${{ github.repository }} --json tagName,createdAt -q '.tagName // empty')
          if [ -z "$LATEST_RELEASE" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          RELEASE_TIME=$(gh release view --repo ${{ github.repository }} --json createdAt -q '.createdAt')
          if [[ "$RELEASE_TIME" > "$RUN_TIME" ]] || [[ "$RELEASE_TIME" == "$RUN_TIME" ]]; then
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          else
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

  build-desktop:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.check.outputs.tag_name }} src-tauri/target/release/bundle/*/* --clobber

  build-android:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Initialize Android
        run: pnpm tauri android init

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          mobile: 'android'

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.check.outputs.tag_name }} src-tauri/target/release/bundle/android/**/*.apk --clobber

  build-ios:
    needs: check
    if: needs.check.outputs.has_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Initialize iOS
        run: pnpm tauri ios init

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          mobile: 'ios'

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.check.outputs.tag_name }} src-tauri/target/release/bundle/ios/**/*.ipa --clobber
