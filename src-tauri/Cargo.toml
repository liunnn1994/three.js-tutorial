[package]
name = "three_js_tutorial"
version = "1.2.6"
description = "A three.js tutorial application built with Tauri and Rust."
authors = ["Norris Lau"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.1"
