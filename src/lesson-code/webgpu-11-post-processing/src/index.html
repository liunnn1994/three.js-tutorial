<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGPU & TSL 教学示例</title><link rel="stylesheet" href="./style.css"></head><body><canvas class="webgl" aria-label="可交互的三维课程示例"></canvas><div id="status" role="status">正在初始化渲染器…</div><script>addEventListener('error', (event) => { document.querySelector('#status').textContent = '加载或渲染失败：' + event.message; document.querySelector('#status').dataset.error = 'true'; }); addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = '初始化失败：' + event.reason; document.querySelector('#status').dataset.error = 'true'; });</script><script type="module" src="./script.js"></script></body></html>
